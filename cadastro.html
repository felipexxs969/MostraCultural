<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta - Mostra Cultural</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section class="login-box">

            <h1>Criar conta</h1>

            <p class="subtitulo">
                Crie sua conta para acessar os mapas
            </p>

            <form id="cadastroForm">

                <label for="nome">
                    Nome
                </label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Digite seu nome"
                    autocomplete="name"
                    required
                >

                <label for="emailCadastro">
                    E-mail
                </label>

                <input
                    type="email"
                    id="emailCadastro"
                    placeholder="Digite seu e-mail"
                    autocomplete="email"
                    required
                >

                <label for="senhaCadastro">
                    Senha
                </label>

                <input
                    type="password"
                    id="senhaCadastro"
                    placeholder="Mínimo de 6 caracteres"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >

                <button
                    type="submit"
                    id="botaoCadastro"
                >
                    Criar conta
                </button>

            </form>

            <p
                id="mensagemCadastro"
                class="mensagem"
            ></p>

            <p class="link-cadastro">
                Já possui uma conta?
                <a href="login.html">
                    Entrar
                </a>
            </p>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
