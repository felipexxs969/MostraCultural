<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Mostra Cultural</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="pagina-login">

<main class="login-container">

    <section class="login-box">

        <h1>Entrar</h1>

        <p>
            Faça login para acessar o mapa.
        </p>

        <form id="loginForm">

            <label for="email">
                E-mail
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Digite seu e-mail"
                required
            >

            <label for="senha">
                Senha
            </label>

            <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Digite sua senha"
                required
            >

            <button
                type="submit"
                id="botaoLogin"
            >
                Entrar
            </button>

            <p id="mensagem"></p>

        </form>

        <p>
            Ainda não tem uma conta?
            <a href="cadastro.html">Cadastrar</a>
        </p>

    </section>

</main>

<script src="script.js"></script>

</body>
</html>
