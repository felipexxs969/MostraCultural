<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Mapa - Mostra Cultural</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <script src="site-config.js"></script>

</head>

<body class="pagina-mapa">

<header class="barra-mapa">

    <strong id="nomeAndar">
        Mapa
    </strong>

</header>


<main
    id="mapa-viewport"
    aria-label="Mapa do andar"
>

    <div id="site"></div>

</main>


<script>

async function verificarLogin() {

    const token =
        sessionStorage.getItem("token");


    if (!token) {

        window.location.href =
            "login.html";

        return false;
    }


    try {

        const resposta =
            await fetch(
                "/api/auth/me",
                {
                    method: "GET",

                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        const dados =
            await resposta.json();


        if (
            !resposta.ok ||
            !dados.sucesso
        ) {

            sessionStorage.removeItem(
                "token"
            );

            sessionStorage.removeItem(
                "usuario"
            );


            window.location.href =
                "login.html";

            return false;
        }


        sessionStorage.setItem(
            "usuario",
            dados.nome
        );


        return true;

    }

    catch (erro) {

        console.error(
            "Erro ao verificar login:",
            erro
        );


        sessionStorage.removeItem(
            "token"
        );

        sessionStorage.removeItem(
            "usuario"
        );


        window.location.href =
            "login.html";

        return false;
    }
}


function mostrarNomeDoAndar() {

    const parametros =
        new URLSearchParams(
            window.location.search
        );


    const andar =
        parametros.get("andar") ||
        "patio";


    const nomes = {

        patio: "Pátio",

        andar1: "1º Andar",

        andar2: "2º Andar",

        andar3: "3º Andar"

    };


    const elemento =
        document.getElementById(
            "nomeAndar"
        );


    if (elemento) {

        elemento.textContent =
            nomes[andar] ||
            "Mapa";
    }
}


(async function iniciarPagina() {

    const autenticado =
        await verificarLogin();


    if (!autenticado) {
        return;
    }


    mostrarNomeDoAndar();


    const scriptMapa =
        document.createElement(
            "script"
        );


    scriptMapa.src =
        "mapa.js";


    scriptMapa.onload =
        function() {

            console.log(
                "mapa.js carregado com sucesso."
            );

        };


    scriptMapa.onerror =
        function() {

            console.error(
                "Não foi possível carregar o mapa."
            );

        };


    document.body.appendChild(
        scriptMapa
    );

})();

</script>

</body>
</html>
